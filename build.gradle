/*
 * Minima Core build configuration
 * Updated for Gradle 8.5 + Java 21 compatibility
 */

plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    implementation files('lib/bcpkix-jdk15on-169.jar')
    implementation files('lib/bcprov-jdk15on-169.jar')
    implementation files('lib/bcutil-jdk15on-169.jar')
    implementation files('lib/h2-2.4.240.jar')
    implementation files('lib/mysql-connector-java-8.0.24.jar')
    implementation files('lib/junit-4.13.jar')
}

sourceSets {
    main {
         java {
            srcDirs = ['src']
         }

        resources {
            srcDirs = ['resources']
        }
    }

    test {
        java {
            srcDirs = ['test']
        }
    }
}

tasks.withType(AbstractArchiveTask) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

shadowJar {
    minimize()
}

application {
    mainClass = 'org.minima.Minima'
}

jar {
    manifest {
        attributes 'Main-Class': 'org.minima.Minima'
    }
}