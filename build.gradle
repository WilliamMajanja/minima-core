/*
 * Minima Core build configuration
 * Updated for Gradle 8.10.2 + Java 11 compatibility
 * Security fixes: BouncyCastle jdk18on, H2 2.4.240, MySQL 9.7.0
 * Proof system fixes: WOTS+ key reuse, monotonic cache, MMR bounds, stream safety
 */

plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '8.3.11'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    // BouncyCastle jdk18on (fixes CVE-2024-29857, CVE-2024-30171, CVE-2024-30172,
    // CVE-2024-34447, CVE-2025-8916, CVE-2026-0636, CVE-2026-5588)
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85'
    implementation 'org.bouncycastle:bcutil-jdk18on:1.85'

    // H2 Database (fixes CVE-2023-44487, CVE-2021-42392)
    implementation 'com.h2database:h2:2.5.250'

    // MySQL Connector (fixes CVE-2023-22102 and others)
    implementation 'com.mysql:mysql-connector-j:9.7.0'

    // Security constraint overrides
    constraints {
        implementation('com.google.protobuf:protobuf-java:4.35.1') {
            because 'Fixes DoS vulnerability CVE-2024-7254'
        }
        implementation('com.google.guava:guava:33.6.0-jre') {
            because 'Fixes info disclosure and insecure temp directory'
        }
        implementation('commons-io:commons-io:2.22.0') {
            because 'Security and bug fix updates'
        }
        implementation('org.codehaus.plexus:plexus-utils:4.0.3') {
            because 'Fixes CVE-2025-67030 directory traversal vulnerability'
        }
        implementation('org.apache.logging.log4j:log4j-core:2.26.1') {
            because 'Fixes CVE-2025-68161, CVE-2026-34477, CVE-2026-34478, CVE-2026-34480'
        }
    }
}

sourceSets {
    main {
         java {
            srcDirs = ['src']
         }

        resources {
            srcDirs = ['resources']
        }
    }

    test {
        java {
            srcDirs = ['test']
        }
    }
}

tasks.withType(AbstractArchiveTask) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

shadowJar {
    minimize()
}

application {
    mainClass = 'org.minima.Minima'
}

jar {
    manifest {
        attributes 'Main-Class': 'org.minima.Minima'
    }
}